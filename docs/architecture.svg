<svg xmlns="http://www.w3.org/2000/svg" width="908" height="474" viewBox="0 0 908 474" role="img" aria-labelledby="ttl desc" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="ttl">ptx-forge architecture</title>
  <desc id="desc">PTX passes through the front end, CFG, dataflow passes and register allocator. The cubin from the CUDA driver JIT, ptxas or a file is parsed and compared with the allocator's prediction.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9z" style="fill:var(--line)"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9z" style="fill:var(--accent)"/>
    </marker>
    <style>
      :root{--bg:#ffffff;--ink:#1f2328;--sub:#656d76;--line:#8c959f;--rule:#d0d7de;--accent:#0b6e8a}
      @media (prefers-color-scheme: dark){
        :root{--bg:#0d1117;--ink:#e6edf3;--sub:#8d96a0;--line:#6e7681;--rule:#30363d;--accent:#56c4e0}
      }
      text{fill:var(--ink)}
      .name{font-size:13.5px;font-weight:600}
      .d{font-size:11.5px;fill:var(--sub)}
      .m{font-family:ui-monospace,Cascadia Code,Consolas,Menlo,monospace;font-size:12px}
      .p{font-family:ui-monospace,Cascadia Code,Consolas,Menlo,monospace;font-size:11px;fill:var(--sub)}
      .cap{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--sub)}
      .box{fill:none;stroke:var(--rule);stroke-width:1}
      .hi{fill:none;stroke:var(--accent);stroke-width:1.4}
      .ln{fill:none;stroke:var(--line);stroke-width:1.2;marker-end:url(#a)}
      .lead{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
      .acc{fill:none;stroke:var(--accent);stroke-width:1.4;marker-end:url(#b)}
      .div{stroke:var(--rule)}
    </style>
  </defs>
  <rect width="908" height="474" fill="var(--bg)"/>


  <text x="32" y="42" class="m">kernel.ptx</text>
  <path class="ln" d="M127 48V66"/>

  <rect class="box" x="32" y="66" width="190" height="166" rx="4"/>
  <text x="48" y="92" class="name">Front-end</text><text x="48" y="109" class="d">recursive-descent parser</text>
  <path class="div" d="M48 121H206"/>
  <text x="48" y="143" class="m">Lexer</text><text x="48" y="165" class="m">Parser</text><text x="48" y="187" class="m">ir::Module</text>
  <text x="48" y="213" class="p">frontend/</text>

  <rect class="box" x="250" y="66" width="190" height="166" rx="4"/>
  <text x="266" y="92" class="name">Control flow</text><text x="266" y="109" class="d">blocks, edges, loops</text>
  <path class="div" d="M266 121H424"/>
  <text x="266" y="143" class="m">BasicBlock</text><text x="266" y="165" class="m">ControlFlowGraph</text><text x="266" y="187" class="m">natural loops</text>
  <text x="266" y="213" class="p">ir/</text>

  <rect class="box" x="468" y="66" width="190" height="166" rx="4"/>
  <text x="484" y="92" class="name">Dataflow</text><text x="484" y="109" class="d">bitset liveness, DCE</text>
  <path class="div" d="M484 121H642"/>
  <text x="484" y="143" class="m">DeadCodeElim</text><text x="484" y="165" class="m">LivenessAnalysis</text><text x="484" y="187" class="m">InterferenceGraph</text>
  <text x="484" y="213" class="p">passes/</text>

  <rect class="box" x="686" y="66" width="190" height="166" rx="4"/>
  <text x="702" y="92" class="name">Allocator</text><text x="702" y="109" class="d">Chaitin-Briggs, K colours</text>
  <path class="div" d="M702 121H860"/>
  <text x="702" y="143" class="m">simplify / select</text><text x="702" y="165" class="m">potential spill</text><text x="702" y="187" class="m">rewrite_spills</text>
  <text x="702" y="213" class="p">passes/</text>

  <path class="ln" d="M222 149H250"/><path class="ln" d="M440 149H468"/><path class="ln" d="M658 149H686"/>

  <path class="lead" d="M345 232V260"/><text x="345" y="276" text-anchor="middle" class="m">cfg.dot</text>
  <path class="lead" d="M563 232V260"/><text x="563" y="276" text-anchor="middle" class="m">--heatmap</text>
  <path class="lead" d="M740 232V260"/><text x="740" y="276" text-anchor="middle" class="m">spilled.ptx</text>

  <path class="div" d="M32 310H876"/>
  <text x="32" y="330" class="cap">GROUND TRUTH</text>

  <rect class="box" x="32" y="342" width="190" height="99" rx="4"/>
  <text x="48" y="368" class="m" font-weight="600">CubinProvider</text>
  <text x="48" y="388" class="d">DriverJITLinker  (cuLink*)</text>
  <text x="48" y="405" class="d">PtxasProvider</text>
  <text x="48" y="422" class="d">FileCubinProvider</text>

  <rect class="box" x="250" y="342" width="190" height="99" rx="4"/>
  <text x="266" y="368" class="m" font-weight="600">ElfCubinParser</text>
  <text x="266" y="388" class="d">sh_info, .nv.info records</text>
  <text x="266" y="405" class="d">REGCOUNT, FRAME_SIZE</text>
  <text x="266" y="422" class="d">sections, symbols</text>
  <path class="ln" d="M222 392H250"/>

  <rect class="hi" x="686" y="342" width="190" height="99" rx="4"/>
  <text x="702" y="368" class="name">Report</text>
  <text x="702" y="388" class="d">predicted vs actual</text>
  <text x="702" y="405" class="d">registers, spill frame,</text>
  <text x="702" y="422" class="d">shared memory</text>
  <path class="acc" d="M440 392H686"/>
  <text x="563" y="384" text-anchor="middle" class="d">cubin facts</text>

  <path class="acc" d="M812 232V342"/>
  <text x="804" y="296" text-anchor="end" class="m" style="fill:var(--accent)">prediction</text>
</svg>
